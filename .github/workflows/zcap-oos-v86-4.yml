name: ZCAP v86.4 production body acquisition

on:
  push:
    branches:
      - zcap-oos-v86-4

permissions:
  contents: read

jobs:
  acquire:
    strategy:
      fail-fast: false
      matrix:
        include:
          - chain: base
            from_block: "51300926"
            to_block: "51336483"
            solve_timeout: "4.62"
          - chain: arbitrum-one
            from_block: "505098473"
            to_block: "505365109"
            solve_timeout: "4.84"
          - chain: bnb
            from_block: "121850336"
            to_block: "122000731"
            solve_timeout: "2.35"

    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Install exact replay tool
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir cow-backtester==0.11.1

      - name: Start empty deterministic solver
        run: |
          cat > empty_solver.py <<'PY'
          import json
          import sys
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  n = int(self.headers.get("Content-Length", "0"))
                  if n:
                      self.rfile.read(n)
                  body = json.dumps({"solutions": []}).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *_):
                  pass

          port = int(sys.argv[1])
          HTTPServer(("127.0.0.1", port), Handler).serve_forever()
          PY
          python3 empty_solver.py 18080 >/tmp/empty_solver.log 2>&1 &
          echo $! >/tmp/empty_solver.pid

      - name: Acquire exact production bodies
        env:
          CHAIN: ${{ matrix.chain }}
          FROM_BLOCK: ${{ matrix.from_block }}
          TO_BLOCK: ${{ matrix.to_block }}
          SOLVE_TIMEOUT: ${{ matrix.solve_timeout }}
        run: |
          mkdir -p "archive/$CHAIN" "records"
          cow-backtester             --chain "$CHAIN"             --env prod             --from-block "$FROM_BLOCK"             --to-block "$TO_BLOCK"             --solver-url http://127.0.0.1:18080             --solver-name zcap-empty-acquisition             --solve-timeout "$SOLVE_TIMEOUT"             --workers 16             --archive-bodies "archive/$CHAIN"             --json-out "records/$CHAIN.jsonl"             --quiet
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          chain = os.environ["CHAIN"]
          root = pathlib.Path("archive") / chain
          manifest = root / "manifest.jsonl"
          rows = manifest.read_bytes().splitlines() if manifest.exists() else []
          bodies = list(root.glob("*.json.gz"))
          meta = {
              "chain": chain,
              "from_block": int(os.environ["FROM_BLOCK"]),
              "to_block": int(os.environ["TO_BLOCK"]),
              "solve_timeout": float(os.environ["SOLVE_TIMEOUT"]),
              "body_count": len(bodies),
              "manifest_lines": len(rows),
              "manifest_sha256": hashlib.sha256(manifest.read_bytes()).hexdigest() if manifest.exists() else None,
              "records_sha256": hashlib.sha256((pathlib.Path("records") / (chain + ".jsonl")).read_bytes()).hexdigest(),
          }
          pathlib.Path("records", chain + ".metadata.json").write_text(json.dumps(meta, indent=2, sort_keys=True))
          print(json.dumps(meta, indent=2))
          PY

      - name: Upload body archive and metadata
        uses: actions/upload-artifact@v4
        with:
          name: zcap-v86-4-${{ matrix.chain }}
          path: |
            archive/${{ matrix.chain }}/
            records/${{ matrix.chain }}.jsonl
            records/${{ matrix.chain }}.metadata.json
          if-no-files-found: error
          retention-days: 7
